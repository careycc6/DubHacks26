<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cart Court · Case File</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Inter:wght@400;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="file">
    <header>
      <div>
        <div class="caseno" id="caseno">Case file</div>
        <h1>The People <span class="v">v.</span> The Family Cart</h1>
        <div class="subtitle" id="subtitle">Awaiting arguments</div>
      </div>
      <div class="header-side">
        <div class="day" id="day">Day 0</div>
        <div class="textline" id="textline"></div>
      </div>
    </header>

    <section class="totals" id="totals"></section>
    <div id="exhibitsWrap"></div>
    <div id="sections"></div>
    <div id="timelineWrap"></div>
    <div id="nestWrap"></div>

    <footer class="ordered" id="ordered" hidden>
      <div>
        <div class="so">SO ORDERED.</div>
        <div class="sig">⚖️ Cart Court, presiding · <span id="orderedDay"></span></div>
      </div>
      <a class="btn" href="/checkout">Proceed to checkout →</a>
    </footer>
    <p class="fine">Synthetic data only. No real customer, account, or transaction data. Every number comes from the pricing engine, never the AI.</p>
  </main>

<script src="/casefile.js"></script>
<script>
const es = new EventSource("/api/events");
es.addEventListener("state", (e) => render(JSON.parse(e.data)));
</script>
</body>
</html>
