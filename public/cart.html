<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cart Court · Case File</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Inter:wght@400;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="file">
    <header>
      <div>
        <div class="caseno" id="caseno">Case file</div>
        <h1>The People <span class="v">v.</span> The Family Cart</h1>
        <div class="subtitle" id="subtitle">Awaiting arguments</div>
      </div>
      <div class="header-side">
        <div class="day" id="day">Day 0</div>
        <div class="textline" id="textline"></div>
        <a class="btn ghost acct" id="acct" href="/login" hidden>Parent sign-in</a>
      </div>
    </header>

    <aside class="join-qr" id="joinQr" hidden></aside>
    <section class="totals" id="totals"></section>
    <div id="exhibitsWrap"></div>
    <div id="sections"></div>
    <div id="timelineWrap"></div>
    <div id="nestWrap"></div>
    <div id="boughtWrap"></div>

    <footer class="ordered" id="ordered" hidden>
      <div>
        <div class="so">SO ORDERED.</div>
        <div class="sig">⚖️ Cart Court, presiding · <span id="orderedDay"></span></div>
      </div>
      <a class="btn" href="/checkout">Proceed to checkout →</a>
    </footer>
    <p class="fine">Synthetic data only. No real customer, account, or transaction data. Every number comes from the pricing engine, never the AI. · <a href="/login">Parent sign-in</a></p>
  </main>

<script src="/casefile.js"></script>
<script src="/live.js"></script>
<script>
live({ onState: render });
// On a big screen (projector, laptop), invite people in. Phones already have the case file open.
fetch("/api/share").then((r) => r.json()).then((sh) => {
  $("joinQr").innerHTML = `<figure><img src="/api/qr?for=cart" alt="QR code: case file"><figcaption>Scan for the case file</figcaption></figure>` +
    (sh.textUrl ? `<figure><img src="/api/qr?for=text" alt="QR code: text the court"><figcaption>Scan to text the court</figcaption></figure>` : "");
  $("joinQr").hidden = false;
});
// Parents: set up the family the first time, sign in after that, and get back to setup once signed in.
fetch("/api/auth/me").then((r) => r.json()).then((me) => {
  const a = $("acct");
  if (me.user || me.admin) [a.textContent, a.href] = ["Family setup →", me.next];
  else if (me.claimable) [a.textContent, a.href] = ["Set up your family →", "/login?next=%2Fwelcome"];
  else [a.textContent, a.href] = ["Parent sign-in", "/login"];
  a.hidden = false;
}).catch(() => { $("acct").hidden = false; });
</script>
</body>
</html>
