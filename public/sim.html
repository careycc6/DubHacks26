<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cart Court · Simulator</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Inter:wght@400;600&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="sim">
  <section class="phone">
    <div class="tabs" id="tabs"></div>
    <div class="thread" id="thread"></div>
    <div class="typing" id="typing"></div>
    <form class="compose" id="compose">
      <select id="who" title="Send as"></select>
      <input type="text" id="text" placeholder="iMessage" autocomplete="off" />
      <label title="Attach photo">📎<input type="file" id="file" accept="image/*" hidden /></label>
      <button>↑</button>
    </form>
  </section>
  <section class="right">
    <div class="controls">
      <strong style="align-self:center;margin-right:6px">Demo</strong>
      <button data-act="argue">▶ Play the argument</button>
      <button data-act="seed">Seed cart (instant)</button>
      <button data-act="advance" data-days="41">+41 days</button>
      <button data-act="advance" data-days="120">+120 days</button>
      <button data-act="advance" data-days="730">+2 years</button>
      <button data-act="reset">Reset</button>
    </div>
    <iframe src="/cart" title="Live case file"></iframe>
  </section>
</div>
<script src="/live.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const cap = (s) => String(s ?? "").replace(/^./, (c) => c.toUpperCase());
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let members = [], lines = [], tab = "sim:group", pendingImage = null;

function renderTabs() {
  $("tabs").innerHTML = [["sim:group", "👨‍👩‍👧‍👦 Family group"], ...members.map((m) => [`sim:dm:${m.id}`, `🔒 ${m.name} ↔ Court`]), ["sim:dm:new:+15555550199", "📱 New phone ↔ Court"]]
    .map(([id, label]) => `<button class="tab ${id === tab ? "on" : ""}" data-tab="${id}">${label}</button>`).join("");
  if (tab.startsWith("sim:dm:")) $("who").value = tab.slice("sim:dm:".length);
}

// Tapbacks (src/tapback.ts logs them the way iMessage does: Disliked “…”). 👎 appeals a ruling, ❓ asks why.
const TAPS = [["👍", "Liked"], ["👎", "Disliked", "appeal"], ["❓", "Questioned", "why?"], ["❤️", "Loved"], ["😂", "Laughed at"], ["‼️", "Emphasized"]];
const TAP_LINE = /^(Liked|Disliked|Questioned|Loved|Laughed at|Emphasized) “(.*?)(…)?”$/;
const nameOf = (id) => members.find((m) => m.id === id)?.name ?? id;

function renderThread() {
  const me = $("who").value;
  const shown = lines.filter((l) => l.spaceId === tab);
  const badges = {}; // court line id -> { member: their tapback } (one each, like iMessage: a new one replaces the old)
  for (const [i, l] of shown.entries()) {
    const t = l.from !== "court" && l.text.match(TAP_LINE);
    if (!t) continue;
    const target = shown.slice(0, i).reverse().find((x) => x.from === "court" && x.text.split("\n")[0].startsWith(t[2]));
    if (target) (badges[target.id] ??= {})[l.from] = TAPS.find(([, v]) => v === t[1])[0];
  }
  $("thread").innerHTML = shown.map((l) => {
    const t = l.from !== "court" && l.text.match(TAP_LINE);
    if (t) return `<div class="tapnote">${esc(nameOf(l.from))} ${esc(TAPS.find(([, v]) => v === t[1])[0])} ${esc(t[1].toLowerCase())} “${esc(t[2])}${t[3] ?? ""}”</div>`;
    const cls = l.from === "court" ? "court" : l.from === me ? "me" : "them";
    const name = l.from === "court" ? "⚖️ Cart Court" : nameOf(l.from);
    const extra = cls === "court" ? `${badges[l.id] ? `<span class="taps">${[...new Set(Object.values(badges[l.id]))].join("")}</span>` : ""}<button class="react-btn" type="button" title="React (👎 appeals, ❓ asks why)" aria-label="React to this message">☺</button>` : "";
    return `<div class="who ${cls === "me" ? "right" : ""}">${esc(name)}</div><div class="bubble ${cls}${l.fresh && l.effect ? ` fx-${l.effect}` : ""}" ${cls === "court" ? `data-line="${l.id}"` : ""}>${l.image ? `<img src="${l.image}">` : ""}${esc(l.text)}${extra}</div>`;
  }).join("");
  $("thread").scrollTop = 1e9;
  if (lines.some((l) => l.fresh && l.effect === "confetti" && l.spaceId === tab)) confetti();
  for (const l of lines) delete l.fresh; // animate once, on arrival
}

// "it's time" arrives like iMessage confetti (reduced-motion users get the plain bubble).
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const r = $("thread").getBoundingClientRect(), colors = ["#ff375f", "#ffd60a", "#30d158", "#0a84ff", "#bf5af2"];
  for (let i = 0; i < 60; i++) {
    const p = document.createElement("i");
    p.className = "confetti";
    p.style.cssText = `left:${r.left + Math.random() * r.width}px;top:${r.top - 12}px;--fall:${r.height + 24}px;background:${colors[i % colors.length]};animation-delay:${Math.random() * 0.4}s;--drift:${(Math.random() - 0.5) * 120}px;--spin:${Math.random() * 720}deg`;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 2600);
  }
}

function closeTapbar() {
  document.querySelector(".tapbar")?.remove();
  document.querySelector(".bubble.picking")?.classList.remove("picking");
}
function openTapbar(bubble) {
  closeTapbar();
  bubble.classList.add("picking");
  const bar = document.createElement("div");
  bar.className = "tapbar" + (bubble.offsetTop - $("thread").scrollTop < 56 ? " below" : "");
  bar.setAttribute("role", "menu");
  bar.innerHTML = TAPS.map(([e, verb, acts]) => `<button type="button" role="menuitem" data-tap="${e}" title="${verb}${acts ? `: ${acts}` : ""}" aria-label="${verb}${acts ? `: ${acts}` : ""}">${e}${acts ? `<small>${acts}</small>` : ""}</button>`).join("");
  bubble.append(bar);
  bar.querySelector("button").focus();
}
$("thread").addEventListener("click", async (e) => {
  const tap = e.target.closest("[data-tap]");
  if (tap) {
    const line = tap.closest("[data-line]").dataset.line;
    closeTapbar();
    $("typing").textContent = "Cart Court is typing…";
    await fetch("/api/sim/message", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ memberId: $("who").value, dm: tab !== "sim:group", tapback: tap.dataset.tap, lineId: line }) });
    $("typing").textContent = "";
    return;
  }
  const btn = e.target.closest(".react-btn");
  if (btn) return openTapbar(btn.closest(".bubble"));
  closeTapbar();
});
$("thread").addEventListener("dblclick", (e) => { const b = e.target.closest(".bubble.court"); if (b) { window.getSelection()?.removeAllRanges(); openTapbar(b); } });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeTapbar(); });

$("tabs").onclick = (e) => { const t = e.target.closest("[data-tab]"); if (t) { tab = t.dataset.tab; renderTabs(); renderThread(); } };
$("who").onchange = renderThread;
$("file").onchange = () => {
  const f = $("file").files[0]; if (!f) return;
  const r = new FileReader(); r.onload = () => { pendingImage = r.result; $("text").placeholder = "📷 photo attached, add a message"; }; r.readAsDataURL(f);
};
$("compose").onsubmit = async (e) => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!text && !pendingImage) return;
  const body = { memberId: $("who").value, text, dm: tab !== "sim:group", image: pendingImage };
  $("text").value = ""; pendingImage = null; $("file").value = ""; $("text").placeholder = "iMessage";
  $("typing").textContent = "Cart Court is typing…";
  await fetch("/api/sim/message", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  $("typing").textContent = "";
};
document.querySelector(".controls").onclick = async (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.act === "reset") lines = [];
  await fetch(`/api/demo/${b.dataset.act}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ days: Number(b.dataset.days) }) });
  renderThread();
};

live({
  onState: (s) => {
  if (!members.length) {
    members = s.members;
    $("who").innerHTML = members.map((m) => `<option value="${m.id}">${esc(m.name)} (${esc(cap(m.role))})</option>`).join("") + `<option value="new:+15555550199">📱 New phone (unknown)</option>`;
    renderTabs();
  }
  },
  onChat: (c) => { lines.push({ ...c, fresh: true }); renderThread(); },
});
</script>
</body>
</html>
